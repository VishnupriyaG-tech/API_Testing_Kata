name: API Testing Kata CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Cucumber test suite
        run: mvn test

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-html-report
          path: target/cucumber-html-reports/
          retention-days: 14

      - name: Upload Cucumber JSON report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-json-report
          path: target/cucumber-reports/cucumber.json
          retention-days: 14